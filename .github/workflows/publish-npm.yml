name: Publish @re-code/flux to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Ensure npm supports Trusted Publishing
        run: npm install --global 'npm@^11.5.1'
      - name: Require committed workspace lockfile
        run: test -f package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify release tag and repository metadata
        run: npm run check:release
      - name: Publish package with npm Trusted Publishing
        run: npm publish --access public

name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js for npm Trusted Publishing
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate release tag and package metadata
        run: npm run check:release
      - name: Check canonical roadmap and workflow copies
        run: |
          npm run check:roadmap
          npm run check:workflow-sync
      - name: Type-check library and tests
        run: |
          npm run typecheck
          npm run typecheck:tests
      - name: Run tests
        run: npm test -- --runInBand
      - name: Build and verify package
        run: |
          npm run build:lib
          node scripts/check-tree-shaking.mjs
          node scripts/check-package-files.mjs
      - name: Publish with npm Trusted Publishing (OIDC)
        run: npm publish --provenance --access public

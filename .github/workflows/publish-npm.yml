name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js for npm Trusted Publishing
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify npm Trusted Publishing runtime
        run: node scripts/check-trusted-publishing-runtime.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium for browser integration
        run: npx playwright install --with-deps chromium
      - name: Validate release tag and package metadata
        run: npm run check:release
      - name: Run full release validation
        run: npm run check:all
      - name: Publish with npm Trusted Publishing (OIDC)
        shell: bash
        run: |
          VERSION="$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version)')"
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG="${VERSION#*-}"
            DIST_TAG="${DIST_TAG%%.*}"
          else
            DIST_TAG="latest"
          fi
          echo "Publishing @re-code/flux@$VERSION with npm dist-tag '$DIST_TAG'."
          npm publish --provenance --access public --tag "$DIST_TAG"
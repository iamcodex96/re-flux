name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: re-flux-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate library and docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Require committed workspace lockfile
        run: test -f package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check library
        run: npm run typecheck
      - name: Type-check tests
        run: npm run typecheck:tests
      - name: Run Jest
        run: npm test -- --runInBand
      - name: Check Visual Lab lifecycle and layout
        run: npm run check:visual-lab
      - name: Check Playground lifecycle
        run: npm run check:playground-lifecycle
      - name: Verify tree-shaking boundaries
        run: npm run check:tree-shaking
      - name: Verify package contents
        run: npm run check:package
      - name: Build library and documentation
        run: npm run build

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check library
        run: npm run typecheck
      - name: Type-check tests
        run: npm run typecheck:tests
      - name: Run Jest suite
        run: npm test -- --runInBand
      - name: Install Chromium for browser integration
        if: matrix.node == 24
        run: npx playwright install --with-deps chromium
      - name: Check browser integration contracts
        if: matrix.node == 24
        run: npm run check:browser-integration
      - name: Check Visual Lab structure
        run: npm run check:visual-lab
      - name: Check Playground lifecycle
        run: npm run check:playground-lifecycle
      - name: Build library
        run: npm run build:lib
      - name: Verify tree-shaking
        run: node scripts/check-tree-shaking.mjs
      - name: Verify package contents
        run: node scripts/check-package-files.mjs
      - name: Validate public package consumer
        run: node scripts/check-package-consumer.mjs
      - name: Check documentation and demo contracts
        if: matrix.node == 24
        run: npm run check:docs
      - name: Build documentation
        if: matrix.node == 24
        run: npm run build --workspace=re-flux-docs
